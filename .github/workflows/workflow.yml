name: Build and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpeg"
      - "**/*.jpg"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  init:
    name: Init
    runs-on: ubuntu-26.04

    outputs:
      release-name: ${{ steps.vars.outputs.release-name }}
      release-tag: ${{ steps.vars.outputs.release-tag }}
      safe-ref: ${{ steps.vars.outputs.safe-ref }}
      short-sha: ${{ steps.vars.outputs.short-sha }}
      version: ${{ steps.vars.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute workflow variables
        id: vars
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          safe_ref="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"

          version="$(
            python3 -c '
          import sys
          import xml.etree.ElementTree as ET

          version = ET.parse("Directory.Build.props").getroot().findtext(".//SharpEmuVersion")

          if not version:
              sys.exit("Directory.Build.props is missing SharpEmuVersion")

          print(version)
          '
          )"

          release_tag="v${version}"
          release_name="NVDS5 v${version}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${release_tag}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match project version ${release_tag}." >&2
            exit 1
          fi

          {
            echo "short-sha=${short_sha}"
            echo "safe-ref=${safe_ref}"
            echo "release-tag=${release_tag}"
            echo "release-name=${release_name}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

  reuse:
    name: REUSE Compliance
    needs: init
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run REUSE lint
        uses: fsfe/reuse-action@v6

  build:
    name: Build win-x64
    needs:
      - init
      - reuse
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      PUBLISH_DIR: ${{ github.workspace }}\artifacts\publish\win-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.103
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            Directory.Build.props

      - name: Restore solution
        run: dotnet restore SharpEmu.slnx

      - name: Build solution
        run: dotnet build SharpEmu.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test SharpEmu.slnx -c Release --no-build --verbosity normal

      - name: Validate synthetic shaders
        run: dotnet run --project tools/SharpEmu.Tools.ShaderDump/SharpEmu.Tools.ShaderDump.csproj -c Release -- artifacts/shader-dump

      - name: Publish win-x64 CLI
        run: dotnet publish src/SharpEmu.CLI/SharpEmu.CLI.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishDir="${env:PUBLISH_DIR}"

      - name: Verify Windows publish output
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:PUBLISH_DIR}\SharpEmu.exe")) {
            Write-Error "SharpEmu.exe was not found in ${env:PUBLISH_DIR}"
            Get-ChildItem -Path "${env:PUBLISH_DIR}" -Recurse
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvds5-win-x64-${{ needs.init.outputs.short-sha }}
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          include-hidden-files: true

  build-posix:
    name: Build ${{ matrix.rid }}
    needs:
      - init
      - reuse
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64

    env:
      DOTNET_NOLOGO: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}
      SPIRV_HEADERS_COMMIT: ad9184e76a66b1001c29db9b0a3e87f646c64de0
      SPIRV_TARGET_ENV: vulkan1.2
      SPIRV_TOOLS_COMMIT: 0539c81f69a3daeb706fd3477dca61435b475156
      SPIRV_TOOLS_VERSION: v2026.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.103
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            Directory.Build.props

      - name: Restore solution
        run: dotnet restore SharpEmu.slnx

      - name: Build solution
        run: dotnet build SharpEmu.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test SharpEmu.slnx -c Release --no-build --verbosity normal

      - name: Build pinned SPIRV-Tools
        if: matrix.rid == 'linux-x64'
        run: |
          git clone --no-checkout --filter=blob:none \
            https://github.com/KhronosGroup/SPIRV-Tools.git \
            "$RUNNER_TEMP/spirv-tools"

          git -C "$RUNNER_TEMP/spirv-tools" checkout --detach "$SPIRV_TOOLS_COMMIT"

          test "$(git -C "$RUNNER_TEMP/spirv-tools" rev-parse HEAD)" = "$SPIRV_TOOLS_COMMIT"

          git clone --no-checkout --filter=blob:none \
            https://github.com/KhronosGroup/SPIRV-Headers.git \
            "$RUNNER_TEMP/spirv-tools/external/spirv-headers"

          git -C "$RUNNER_TEMP/spirv-tools/external/spirv-headers" checkout --detach "$SPIRV_HEADERS_COMMIT"

          test "$(git -C "$RUNNER_TEMP/spirv-tools/external/spirv-headers" rev-parse HEAD)" = "$SPIRV_HEADERS_COMMIT"

          cmake \
            -S "$RUNNER_TEMP/spirv-tools" \
            -B "$RUNNER_TEMP/spirv-tools-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_WERROR=OFF

          cmake --build "$RUNNER_TEMP/spirv-tools-build" --target spirv-val

      - name: Generate and validate synthetic SPIR-V
        if: matrix.rid == 'linux-x64'
        run: |
          dotnet run \
            --project tools/SharpEmu.Tools.ShaderDump/SharpEmu.Tools.ShaderDump.csproj \
            -c Release \
            -- artifacts/shader-dump

          scripts/validate-synthetic-spirv.sh \
            "$RUNNER_TEMP/spirv-tools-build/tools/spirv-val" \
            "$SPIRV_TOOLS_VERSION" \
            "$SPIRV_TARGET_ENV" \
            artifacts/shader-dump

      - name: Publish ${{ matrix.rid }} CLI
        run: |
          dotnet publish \
            src/SharpEmu.CLI/SharpEmu.CLI.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            --no-restore \
            -p:PublishDir="$PUBLISH_DIR"

      - name: Verify POSIX publish output
        shell: bash
        run: |
          set -euo pipefail

          executable="$PUBLISH_DIR/SharpEmu"

          if [ ! -f "$executable" ]; then
            echo "SharpEmu was not found at: $executable" >&2
            echo "Publish directory contents:" >&2
            find "$PUBLISH_DIR" -maxdepth 8 -print >&2
            exit 1
          fi

          test -s "$executable"

      - name: Stage MoltenVK next to the build
        if: matrix.rid == 'osx-x64'
        run: scripts/fetch-macos-moltenvk.sh "$PUBLISH_DIR"

      - name: Package macOS release assets
        if: matrix.rid == 'osx-x64'
        shell: bash
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts/release-assets"

          chmod +x "$PUBLISH_DIR/SharpEmu"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$PUBLISH_DIR" \
            "$GITHUB_WORKSPACE/artifacts/release-assets/nvds5-${VERSION}-osx-x64.zip"

          hdiutil create \
            -volname "SharpEmu ${VERSION}" \
            -srcfolder "$PUBLISH_DIR" \
            -ov \
            -format UDZO \
            "$GITHUB_WORKSPACE/artifacts/release-assets/nvds5-${VERSION}-osx-x64.dmg"

      - name: Verify macOS release assets
        if: matrix.rid == 'osx-x64'
        shell: bash
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail

          test -s "$GITHUB_WORKSPACE/artifacts/release-assets/nvds5-${VERSION}-osx-x64.zip"
          test -s "$GITHUB_WORKSPACE/artifacts/release-assets/nvds5-${VERSION}-osx-x64.dmg"

      # Put the published files directly at the artifact root. The release
      # job can then find them regardless of download-artifact path handling.
      - name: Stage release artifact
        shell: bash
        run: |
          set -euo pipefail

          staging="$GITHUB_WORKSPACE/artifacts/staged/${{ matrix.rid }}"

          rm -rf "$staging"
          mkdir -p "$staging"

          cp -a "$PUBLISH_DIR"/. "$staging"/

          if [ "${{ matrix.rid }}" = "osx-x64" ]; then
            cp -a "$GITHUB_WORKSPACE/artifacts/release-assets" "$staging/"
          fi

          executable="$(find "$staging" -type f -name SharpEmu -print -quit)"

          if [ -z "$executable" ]; then
            echo "SharpEmu was not found in staged artifact" >&2
            find "$staging" -maxdepth 8 -print >&2
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvds5-${{ matrix.rid }}-${{ needs.init.outputs.short-sha }}
          path: ${{ github.workspace }}/artifacts/staged/${{ matrix.rid }}
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Publish GitHub Release
    needs:
      - init
      - build
      - build-posix

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Show downloaded artifact layout
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloaded artifact layout:"
          find release -maxdepth 10 -print

      - name: Package release assets
        shell: bash
        env:
          SHORT_SHA: ${{ needs.init.outputs.short-sha }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail

          win_root="release/nvds5-win-x64-${SHORT_SHA}"
          linux_root="release/nvds5-linux-x64-${SHORT_SHA}"
          macos_root="release/nvds5-osx-x64-${SHORT_SHA}"

          for artifact_dir in \
            "$win_root" \
            "$linux_root" \
            "$macos_root"; do

            if [ ! -d "$artifact_dir" ]; then
              echo "Artifact directory not found: $artifact_dir" >&2
              find release -maxdepth 10 -print >&2
              exit 1
            fi
          done

          win_executable="$(
            find "$win_root" \
              -type f \
              \( -name SharpEmu.exe -o -name SharpEmu \) \
              -print \
              -quit
          )"

          linux_executable="$(
            find "$linux_root" \
              -type f \
              -name SharpEmu \
              -print \
              -quit
          )"

          if [ -z "$win_executable" ]; then
            echo "SharpEmu.exe was not found in $win_root" >&2
            find "$win_root" -maxdepth 10 -print >&2
            exit 1
          fi

          if [ -z "$linux_executable" ]; then
            echo "SharpEmu was not found in $linux_root" >&2
            find "$linux_root" -maxdepth 10 -print >&2
            exit 1
          fi

          win_dir="$(dirname "$win_executable")"
          linux_dir="$(dirname "$linux_executable")"

          mkdir -p release-assets

          (
            cd "$win_dir"
            zip -q -r \
              "$GITHUB_WORKSPACE/release-assets/nvds5-${VERSION}-win-x64.zip" \
              .
          )

          chmod +x "$linux_executable"

          tar -czf \
            "release-assets/nvds5-${VERSION}-linux-x64.tar.gz" \
            -C "$linux_dir" \
            .

          macos_zip="$(
            find "$macos_root" \
              -type f \
              -name "nvds5-${VERSION}-osx-x64.zip" \
              -print \
              -quit
          )"

          macos_dmg="$(
            find "$macos_root" \
              -type f \
              -name "nvds5-${VERSION}-osx-x64.dmg" \
              -print \
              -quit
          )"

          if [ -z "$macos_zip" ] || [ -z "$macos_dmg" ]; then
            echo "macOS release assets were not found in $macos_root" >&2
            find "$macos_root" -maxdepth 10 -print >&2
            exit 1
          fi

          cp "$macos_zip" release-assets/
          cp "$macos_dmg" release-assets/

      - name: Verify release assets
        shell: bash
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail

          expected_assets=(
            "release-assets/nvds5-${VERSION}-win-x64.zip"
            "release-assets/nvds5-${VERSION}-linux-x64.tar.gz"
            "release-assets/nvds5-${VERSION}-osx-x64.zip"
            "release-assets/nvds5-${VERSION}-osx-x64.dmg"
          )

          for asset in "${expected_assets[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            fi
          done

      - name: Build release notes
        shell: bash
        env:
          MAX_COMMITS: 200
          RELEASE_TAG: ${{ needs.init.outputs.release-tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SHORT_SHA: ${{ needs.init.outputs.short-sha }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail

          previous_tag="$(
            git describe \
              --tags \
              --abbrev=0 \
              --match 'v*' \
              "${RELEASE_TAG}^" \
              2>/dev/null || true
          )"

          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${RELEASE_TAG}"
          else
            range="${RELEASE_TAG}"
          fi

          git log \
            --no-merges \
            --reverse \
            --pretty=tformat:"%H%x1f%h%x1f%s" \
            "${range}" > commits.txt

          total="$(wc -l < commits.txt)"

          {
            printf \
              'Automated NVDS5 v%s build for commit [`%s`](%s/commit/%s).\n\n' \
              "${VERSION}" \
              "${SHORT_SHA}" \
              "${REPO_URL}" \
              "${GITHUB_SHA}"

            if [ -n "${previous_tag}" ]; then
              printf '## Changes since %s\n\n' "${previous_tag}"
            else
              printf '## Changes\n\n'
            fi

            if [ "${total}" -eq 0 ]; then
              printf '_No commits since %s._\n' "${previous_tag}"
            else
              head -n "${MAX_COMMITS}" commits.txt |
                while IFS=$'\x1f' read -r sha short subject; do
                  printf \
                    -- '- %s ([`%s`](%s/commit/%s))\n' \
                    "${subject}" \
                    "${short}" \
                    "${REPO_URL}" \
                    "${sha}"
                done

              if [ "${total}" -gt "${MAX_COMMITS}" ]; then
                printf \
                  '\n_…and %s more commits._\n' \
                  "$((total - MAX_COMMITS))"
              fi
            fi

            printf '\n'

            if [ -n "${previous_tag}" ]; then
              printf \
                '**Full changelog**: %s/compare/%s...%s\n' \
                "${REPO_URL}" \
                "${previous_tag}" \
                "${RELEASE_TAG}"
            else
              printf \
                '**Full changelog**: %s/commits/%s\n' \
                "${REPO_URL}" \
                "${RELEASE_TAG}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ needs.init.outputs.release-name }}
          RELEASE_TAG: ${{ needs.init.outputs.release-tag }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(
            find release-assets \
              -maxdepth 1 \
              -type f \
              \( -name '*.zip' -o -name '*.tar.gz' \) |
              sort
          )

          if [ "${#assets[@]}" -ne 4 ]; then
            echo "Expected 4 release assets, found ${#assets[@]}." >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; updating its assets."

            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md

            gh release upload \
              "${RELEASE_TAG}" \
              "${assets[@]}" \
              --clobber
          else
            gh release create \
              "${RELEASE_TAG}" \
              "${assets[@]}" \
              --verify-tag \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md
          fi
