name: Build and Release

"on":
  # Tag pushes must not have path filters. GitHub does not evaluate changed
  # paths for tag pushes, so keep the release trigger unambiguous.
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths-ignore:
      - "updater-manifest.json"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpeg"
      - "**/*.jpg"
  # Also allows running the exact tagged workflow manually when a tag was
  # created before the workflow was fixed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  init:
    name: Init
    runs-on: ubuntu-24.04
    outputs:
      release-name: ${{ steps.vars.outputs.release-name }}
      release-tag: ${{ steps.vars.outputs.release-tag }}
      safe-ref: ${{ steps.vars.outputs.safe-ref }}
      short-sha: ${{ steps.vars.outputs.short-sha }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute workflow variables
        id: vars
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          safe_ref="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          version="$(python3 -c 'import sys, xml.etree.ElementTree as ET; version = ET.parse("Directory.Build.props").getroot().findtext(".//SharpEmuVersion"); sys.exit("Directory.Build.props is missing SharpEmuVersion") if not version else print(version)')"
          release_tag="v${version}"
          release_name="NVDS5 v${version}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${release_tag}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match project version ${release_tag}." >&2
            exit 1
          fi

          printf 'short-sha=%s\n' "${short_sha}" >> "$GITHUB_OUTPUT"
          printf 'safe-ref=%s\n' "${safe_ref}" >> "$GITHUB_OUTPUT"
          printf 'release-tag=%s\n' "${release_tag}" >> "$GITHUB_OUTPUT"
          printf 'release-name=%s\n' "${release_name}" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${version}" >> "$GITHUB_OUTPUT"

  reuse:
    name: REUSE Compliance
    needs: init
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run REUSE lint
        uses: fsfe/reuse-action@v6

  build:
    name: Build win-x64
    needs:
      - init
      - reuse
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      PUBLISH_DIR: ${{ github.workspace }}\artifacts\publish\win-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.103
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            Directory.Build.props

      - name: Restore solution
        run: dotnet restore SharpEmu.slnx

      - name: Build solution
        run: dotnet build SharpEmu.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test SharpEmu.slnx -c Release --no-build --verbosity normal

      - name: Validate synthetic shaders
        run: dotnet run --project tools/SharpEmu.Tools.ShaderDump/SharpEmu.Tools.ShaderDump.csproj -c Release -- artifacts/shader-dump

      - name: Publish win-x64 CLI
        run: dotnet publish src/SharpEmu.CLI/SharpEmu.CLI.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishDir="${env:PUBLISH_DIR}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvds5-win-x64-${{ needs.init.outputs.short-sha }}
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          include-hidden-files: true

  build-posix:
    name: Build ${{ matrix.rid }}
    needs:
      - init
      - reuse
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
    env:
      DOTNET_NOLOGO: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}
      # Keep the test process on Vulkan. Native Metal is the shipped macOS
      # default, but Metal is not appropriate for headless/unit-test GPU seams.
      SHARPEMU_GPU_BACKEND: vulkan
      SPIRV_HEADERS_COMMIT: ad9184e76a66b1001c29db9b0a3e87f646c64de0
      SPIRV_TARGET_ENV: vulkan1.2
      SPIRV_TOOLS_COMMIT: 0539c81f69a3daeb706fd3477dca61435b475156
      SPIRV_TOOLS_VERSION: v2026.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.103
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            Directory.Build.props

      - name: Restore solution
        run: dotnet restore SharpEmu.slnx

      - name: Build solution
        run: dotnet build SharpEmu.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test SharpEmu.slnx -c Release --no-build --verbosity normal

      - name: Build pinned SPIRV-Tools
        if: ${{ matrix.rid == 'linux-x64' }}
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/KhronosGroup/SPIRV-Tools.git "$RUNNER_TEMP/spirv-tools"
          git -C "$RUNNER_TEMP/spirv-tools" checkout --detach "$SPIRV_TOOLS_COMMIT"
          test "$(git -C "$RUNNER_TEMP/spirv-tools" rev-parse HEAD)" = "$SPIRV_TOOLS_COMMIT"

          git clone --no-checkout --filter=blob:none https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/spirv-tools/external/spirv-headers"
          git -C "$RUNNER_TEMP/spirv-tools/external/spirv-headers" checkout --detach "$SPIRV_HEADERS_COMMIT"
          test "$(git -C "$RUNNER_TEMP/spirv-tools/external/spirv-headers" rev-parse HEAD)" = "$SPIRV_HEADERS_COMMIT"

          cmake -S "$RUNNER_TEMP/spirv-tools" -B "$RUNNER_TEMP/spirv-tools-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_WERROR=OFF
          cmake --build "$RUNNER_TEMP/spirv-tools-build" --target spirv-val

      - name: Generate and validate synthetic SPIR-V
        if: ${{ matrix.rid == 'linux-x64' }}
        run: |
          dotnet run --project tools/SharpEmu.Tools.ShaderDump/SharpEmu.Tools.ShaderDump.csproj -c Release -- artifacts/shader-dump
          scripts/validate-synthetic-spirv.sh \
            "$RUNNER_TEMP/spirv-tools-build/tools/spirv-val" \
            "$SPIRV_TOOLS_VERSION" \
            "$SPIRV_TARGET_ENV" \
            artifacts/shader-dump

      - name: Publish ${{ matrix.rid }} CLI
        run: dotnet publish src/SharpEmu.CLI/SharpEmu.CLI.csproj -c Release -r ${{ matrix.rid }} --self-contained true --no-restore -p:PublishDir="$PUBLISH_DIR"

      - name: Stage MoltenVK next to the build
        if: ${{ matrix.rid == 'osx-x64' }}
        run: scripts/fetch-macos-moltenvk.sh "$PUBLISH_DIR"

      - name: Package macOS release assets
        if: ${{ matrix.rid == 'osx-x64' }}
        shell: bash
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/release-assets"

          # Build a real macOS application bundle around the self-contained
          # publish directory. The CLI executable is also the GUI host.
          app_dir="$GITHUB_WORKSPACE/artifacts/NVDS5.app"
          app_contents="$app_dir/Contents"
          app_macos="$app_contents/MacOS"
          app_resources="$app_contents/Resources"
          app_executable="$app_macos/SharpEmu"

          rm -rf "$app_dir"
          mkdir -p "$app_macos" "$app_resources"
          cp -a "$PUBLISH_DIR"/. "$app_macos"/
          chmod 755 "$app_executable"
          test -x "$app_executable"

          cat > "$app_contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>NVDS5</string>
            <key>CFBundleExecutable</key>
            <string>SharpEmu</string>
            <key>CFBundleIdentifier</key>
            <string>com.nvdemu.nvds5</string>
            <key>CFBundleName</key>
            <string>NVDS5</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
          </dict>
          </plist>
          PLIST

          plutil -lint "$app_contents/Info.plist"
          codesign --force --deep --sign - "$app_dir"
          codesign --verify --deep --strict --verbose=2 "$app_dir"

          ditto -c -k --sequesterRsrc --keepParent "$app_dir" \
            "$GITHUB_WORKSPACE/artifacts/release-assets/nvds5-${VERSION}-osx-x64.zip"

          hdiutil create \
            -volname "NVDS5 ${VERSION}" \
            -srcfolder "$app_dir" \
            -ov \
            -format UDZO \
            "$GITHUB_WORKSPACE/artifacts/release-assets/nvds5-${VERSION}-osx-x64.dmg"

      - name: Verify macOS release assets
        if: ${{ matrix.rid == 'osx-x64' }}
        shell: bash
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          test -s "$GITHUB_WORKSPACE/artifacts/release-assets/nvds5-${VERSION}-osx-x64.zip"
          test -s "$GITHUB_WORKSPACE/artifacts/release-assets/nvds5-${VERSION}-osx-x64.dmg"

      # Stage the executable at the artifact root. This ensures that
      # download-artifact recreates:
      #
      #   release/nvds5-linux-x64-SHORT_SHA/SharpEmu
      #
      # instead of nesting it under publish/linux-x64/.
      - name: Stage release artifact
        shell: bash
        run: |
          set -euo pipefail

          staging="$GITHUB_WORKSPACE/artifacts/staged/${{ matrix.rid }}"
          rm -rf "$staging"
          mkdir -p "$staging"

          cp -a "$PUBLISH_DIR"/. "$staging"/

          if [ "${{ matrix.rid }}" = "osx-x64" ]; then
            cp -a "$GITHUB_WORKSPACE/artifacts/release-assets" "$staging/"
          fi

          test -f "$staging/SharpEmu"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvds5-${{ matrix.rid }}-${{ needs.init.outputs.short-sha }}
          path: ${{ github.workspace }}/artifacts/staged/${{ matrix.rid }}
          if-no-files-found: error
          include-hidden-files: true

  nightly:
    name: Publish Nightly
    needs:
      - init
      - build
      - build-posix
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: nightly

      - name: Package nightly assets
        shell: bash
        env:
          SHORT_SHA: ${{ needs.init.outputs.short-sha }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail

          win_dir="nightly/nvds5-win-x64-${SHORT_SHA}"
          linux_dir="nightly/nvds5-linux-x64-${SHORT_SHA}"
          macos_dir="nightly/nvds5-osx-x64-${SHORT_SHA}"

          for package_dir in "${win_dir}" "${linux_dir}" "${macos_dir}"; do
            test -d "${package_dir}"
          done

          mkdir -p nightly-assets

          (
            cd "${win_dir}"
            zip -q -r "${GITHUB_WORKSPACE}/nightly-assets/nvds5-nightly-win-x64.zip" .
          )

          chmod +x "${linux_dir}/SharpEmu"
          tar -czf "nightly-assets/nvds5-nightly-linux-x64.tar.gz" -C "${linux_dir}" .

          macos_release_dir="${macos_dir}/release-assets"
          test -s "${macos_release_dir}/nvds5-${VERSION}-osx-x64.zip"
          test -s "${macos_release_dir}/nvds5-${VERSION}-osx-x64.dmg"
          cp "${macos_release_dir}/nvds5-${VERSION}-osx-x64.zip" nightly-assets/nvds5-nightly-osx-x64.zip
          cp "${macos_release_dir}/nvds5-${VERSION}-osx-x64.dmg" nightly-assets/nvds5-nightly-osx-x64.dmg

      - name: Publish Nightly release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "NVDS5 Nightly" --notes "Latest successful main build: ${SHA}."
            gh release upload nightly nightly-assets/* --clobber
          else
            gh release create nightly nightly-assets/* --target "${SHA}" --prerelease --title "NVDS5 Nightly" --notes "Latest successful main build: ${SHA}."
          fi

      - name: Update updater manifest
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail

          python3 scripts/update_updater_manifest.py             --channel nightly             --version "${VERSION}"             --sha "${SHA}"             --tag nightly             --assets-dir nightly-assets             --output updater-manifest.json

          manifest_sha="$(gh api "repos/${GH_REPO}/contents/updater-manifest.json" --jq .sha)"
          content="$(base64 -w0 updater-manifest.json)"

          gh api             --method PUT             "repos/${GH_REPO}/contents/updater-manifest.json"             -f message="ci: update nightly updater manifest"             -f content="${content}"             -f sha="${manifest_sha}"             -f branch=main

  release:
    name: Publish GitHub Release
    needs:
      - init
      - build
      - build-posix
    # Stable releases happen for v* tag pushes. Manual runs are also allowed
    # for recovery/testing.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Package release assets
        shell: bash
        env:
          SHORT_SHA: ${{ needs.init.outputs.short-sha }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail

          win_dir="release/nvds5-win-x64-${SHORT_SHA}"
          linux_dir="release/nvds5-linux-x64-${SHORT_SHA}"
          macos_dir="release/nvds5-osx-x64-${SHORT_SHA}"

          for package_dir in "${win_dir}" "${linux_dir}" "${macos_dir}"; do
            test -d "${package_dir}"
          done

          mkdir -p release-assets

          (
            cd "${win_dir}"
            zip -q -r "../../release-assets/nvds5-${VERSION}-win-x64.zip" .
          )

          chmod +x "${linux_dir}/SharpEmu"
          tar -czf "release-assets/nvds5-${VERSION}-linux-x64.tar.gz" -C "${linux_dir}" .

          macos_release_dir="release/nvds5-osx-x64-${SHORT_SHA}/release-assets"
          test -s "${macos_release_dir}/nvds5-${VERSION}-osx-x64.zip"
          test -s "${macos_release_dir}/nvds5-${VERSION}-osx-x64.dmg"

          cp "${macos_release_dir}/nvds5-${VERSION}-osx-x64.zip" release-assets/
          cp "${macos_release_dir}/nvds5-${VERSION}-osx-x64.dmg" release-assets/

      - name: Build release notes
        shell: bash
        env:
          MAX_COMMITS: 200
          RELEASE_TAG: ${{ needs.init.outputs.release-tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SHORT_SHA: ${{ needs.init.outputs.short-sha }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 --match 'v*' "${RELEASE_TAG}^" 2>/dev/null || true)"

          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${RELEASE_TAG}"
          else
            range="${RELEASE_TAG}"
          fi

          git log --no-merges --reverse --pretty=tformat:"%H%x1f%h%x1f%s" "${range}" > commits.txt
          total="$(wc -l < commits.txt)"

          {
            printf 'Automated NVDS5 v%s build for commit [`%s`](%s/commit/%s).\n\n' \
              "${VERSION}" "${SHORT_SHA}" "${REPO_URL}" "${GITHUB_SHA}"

            if [ -n "${previous_tag}" ]; then
              printf '## Changes since %s\n\n' "${previous_tag}"
            else
              printf '## Changes\n\n'
            fi

            if [ "${total}" -eq 0 ]; then
              printf '_No commits since %s._\n' "${previous_tag}"
            else
              head -n "${MAX_COMMITS}" commits.txt | while IFS=$'\x1f' read -r sha short subject; do
                printf -- '- %s ([`%s`](%s/commit/%s))\n' "${subject}" "${short}" "${REPO_URL}" "${sha}"
              done

              if [ "${total}" -gt "${MAX_COMMITS}" ]; then
                printf '\n_…and %s more commits._\n' "$((total - MAX_COMMITS))"
              fi
            fi

            printf '\n'

            if [ -n "${previous_tag}" ]; then
              printf '**Full changelog**: %s/compare/%s...%s\n' "${REPO_URL}" "${previous_tag}" "${RELEASE_TAG}"
            else
              printf '**Full changelog**: %s/commits/%s\n' "${REPO_URL}" "${RELEASE_TAG}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ needs.init.outputs.release-name }}
          RELEASE_TAG: ${{ needs.init.outputs.release-tag }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(
            find release-assets \
              -maxdepth 1 \
              -type f \
              \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' \) |
              sort
          )

          if [ "${#assets[@]}" -ne 4 ]; then
            echo "Expected 4 release assets, found ${#assets[@]}." >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; updating its assets."

            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md

            gh release upload \
              "${RELEASE_TAG}" \
              "${assets[@]}" \
              --clobber
          else
            gh release create \
              "${RELEASE_TAG}" \
              "${assets[@]}" \
              --verify-tag \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md
          fi

      - name: Update updater manifest
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.init.outputs.version }}
          RELEASE_TAG: ${{ needs.init.outputs.release-tag }}
        run: |
          set -euo pipefail

          python3 scripts/update_updater_manifest.py             --channel stable             --version "${VERSION}"             --sha "${SHA}"             --tag "${RELEASE_TAG}"             --assets-dir release-assets             --output updater-manifest.json

          manifest_sha="$(gh api "repos/${GH_REPO}/contents/updater-manifest.json" --jq .sha)"
          content="$(base64 -w0 updater-manifest.json)"

          gh api             --method PUT             "repos/${GH_REPO}/contents/updater-manifest.json"             -f message="ci: update stable updater manifest"             -f content="${content}"             -f sha="${manifest_sha}"             -f branch=main
